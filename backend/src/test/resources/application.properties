# Test-Konfiguration: Tests laufen wie im Original auf der In-Memory-H2.
# Die dateibasierte Schulungs-Datenbank aus src/main/resources/application.properties
# (inkl. ddl-auto=create) gilt nur für den Anwendungsstart — für die Tests würde sie
# bei jedem Kontextstart die Daten der bereits laufenden, gecachten Testkontexte wegräumen.
spring.application.name=KinoSoft
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS filmauswahl\\;CREATE SCHEMA IF NOT EXISTS kartenverkauf
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
# Keine SQL-Initialisierung: Befüllung erfolgt zur Laufzeit über die WochenplanFixture.
spring.sql.init.mode=never
