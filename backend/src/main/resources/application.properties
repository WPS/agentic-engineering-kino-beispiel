spring.application.name=KinoSoft
spring.datasource.url=jdbc:h2:file:./data/kinosoft;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS filmauswahl\\;CREATE SCHEMA IF NOT EXISTS kartenverkauf
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# create statt update: die Wochenplanung erzeugt bei jedem Start neue Vorstellungs-IDs —
# in einer persistenten Datenbank würde jeder Neustart die Demo-Daten duplizieren. Mit
# create startet die dateibasierte H2 leer und wird von den Fixtures frisch befüllt.
# (Die Tests laufen auf der In-Memory-Konfiguration in src/test/resources.)
spring.jpa.hibernate.ddl-auto=create
# Keine SQL-Initialisierung mehr: Filmauswahl und Kartenverkauf werden zur Laufzeit aus dem
# Wochenplan befüllt (siehe WochenplanFixture). Die H2-Schemata legt der INIT-Teil der
# datasource-url an, die Tabellen erzeugt Hibernate (ddl-auto=create).
spring.sql.init.mode=never
logging.file.name=logs/kino-backend.log
